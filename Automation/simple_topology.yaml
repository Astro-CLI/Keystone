# Simple 2-Router OSPF Topology
devices:
  - hostname: R1
    type: router
    description: "Core router with OSPF"
    interfaces:
      - name: GigabitEthernet0/0/0
        ip: 10.0.1.1
        mask: 255.255.255.0
        description: "Link to R2"
    
    ospf:
      process_id: 1
      router_id: 1.1.1.1
      networks:
        - network: 10.0.1.0
          wildcard: 0.0.0.255
          area: 0

  - hostname: R2
    type: router
    description: "Edge router with OSPF"
    interfaces:
      - name: GigabitEthernet0/0/0
        ip: 10.0.1.2
        mask: 255.255.255.0
        description: "Link to R1"
    
    ospf:
      process_id: 1
      router_id: 2.2.2.2
      networks:
        - network: 10.0.1.0
          wildcard: 0.0.0.255
          area: 0
