<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keystone — Network Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="web/app.css">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script defer src="web/tool_engine.js"></script>
</head>
<body>
  <div id="app">
    <!-- ─── Top Bar ─── -->
    <header id="topbar" aria-label="Main Navigation">
      <div class="topbar-left">
        <button id="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle Sidebar">☰</button>
        <span id="topbar-title" title="Go to Dashboard">Keystone</span>
        <span id="topbar-toolname">— Dashboard</span>
      </div>
      <div id="topbar-spacer"></div>
      <div id="topbar-actions">
        <button class="action-btn" id="action-generate" title="Generate CLI config (Ctrl+Enter)">
          <span>▶</span> Generate
        </button>
        <button class="action-btn" id="action-reset" title="Reset config to default template">
          <span>↻</span> Reset
        </button>
        <button class="action-btn" id="action-copy" title="Copy active code block">
          <span>📋</span> Copy
        </button>
      </div>
    </header>

    <!-- ─── Main Workspace ─── -->
    <div id="body">
      <!-- Sidebar -->
      <aside id="sidebar" aria-label="Tool Selection">
        <div class="sidebar-search">
          <input type="text" id="search-input" placeholder="Search generators..." aria-label="Search tools" spellcheck="false">
          <button id="search-clear" style="display: none;" title="Clear search">&times;</button>
        </div>
        <nav id="tool-list"></nav>
      </aside>

      <!-- Main Content -->
      <main id="main">
        <!-- Dashboard View -->
        <div id="dashboard-view">
          <div class="dashboard-hero">
            <h1>Keystone Network Automation</h1>
            <p>Select a protocol or utility generator from the sidebar to begin.</p>
          </div>
          <div class="dashboard-cards" id="dashboard-cards-container"></div>
        </div>

        <!-- Editor View (Hidden by default) -->
        <div id="workspace-view" style="display: none; flex: 1; display: flex; width: 100%;">
          <!-- Input editor pane -->
          <section id="editor-pane" aria-label="YAML/JSON Input Editor">
            <div class="pane-header">
              <span class="pane-label">Input <span class="label-dim">(YAML / JSON)</span></span>
              <div class="pane-header-badges">
                <span id="input-status-badge" class="pane-badge status-empty">Empty</span>
                <span id="line-count" class="pane-badge">0 lines</span>
              </div>
            </div>
            <div class="pane-body">
              <textarea id="input" placeholder="# Paste YAML configuration here..." spellcheck="false" aria-label="Input editor"></textarea>
            </div>
          </section>

          <!-- Splitter -->
          <div id="divider"></div>

          <!-- Output pane -->
          <section id="output-pane" aria-label="Generated Output">
            <div class="pane-header">
              <div class="pane-tabs">
                <button class="pane-tab-btn active" data-tab="cli">Cisco IOS CLI</button>
                <button class="pane-tab-btn" data-tab="ptbuilder">PT-Builder JS</button>
              </div>
              <span id="output-status" class="pane-badge">Idle</span>
            </div>
            <div class="pane-body">
              <textarea id="output" readonly placeholder="! CLI output will appear here..." aria-label="CLI output"></textarea>
              <textarea id="output-ptbuilder" readonly placeholder="// PT script will appear here..." aria-label="PT output" style="display: none;"></textarea>
            </div>
            
            <!-- 7-Step Navigator (For Full Topology) -->
            <div id="step-navigator" style="display: none;">
              <button id="step-prev" class="action-btn" title="Previous step">←</button>
              <div id="step-indicators" style="display: flex; gap: 8px;"></div>
              <button id="step-next" class="action-btn" title="Next step">→</button>
              <div id="step-title" style="margin-left: 12px;">Step 1: Core Mesh</div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- ─── Status Bar ─── -->
    <footer id="statusbar">
      <span id="status-tool">Keystone</span>
      <span id="status-separator">·</span>
      <span id="status-category">Overview</span>
      <span id="status-separator2">·</span>
      <span id="status-keys">Press Ctrl+Enter to generate</span>
      <div id="status-right">
        <span id="status-saved">Ready</span>
      </div>
    </footer>
  </div>

  <div id="toast-container" role="status" aria-live="polite"></div>
</body>
</html>
